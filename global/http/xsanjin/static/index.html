<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button id="userjoin" onclick="userjoin()">login</button>
  <button id="sendmeil" onclick="sendmeil()">sendmeil</button>
  <script>
    function userjoin() {
      fetch('api/login', {
        method: 'post',
        headers: {
          'Content-Type': 'application/json;charset=utf-8'
        },
        body: JSON.stringify({
          name: 'xsanjin',
          passward: '123456'
        })
      }).then(res => {
          res.json().then(data => {
            console.log(data)
            localStorage.setItem('token', data.token)
          })
      }).catch(err => {
        console.log(err)
      })
    }
    function sendmeil() {
      fetch('api/send/meil', {
        method: 'post',
        headers: {
          'Content-Type': 'application/json;charset=utf-8'
        },
        body: JSON.stringify({
          to: 'al1474105320@163.com',
          from: '3167764187@qq.com',
          subject: '测试',
          text: '这是一条测试邮件服务的信息！'
        })
      }).then(res => {
        console.log(res)
      }).catch(err => {
        console.log(err)
      })
    }
  </script>
</body>
</html>
